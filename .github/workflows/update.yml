name: Update stock forecasts

on:
  schedule:
    # 06:00 / 12:00 / 18:00 / 00:00 UTC — 4x taeglich
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-forecasts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run forecast pipeline
        run: python scripts/fetch_and_score.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/predictions.json data/backtest.json
          if git diff --cached --quiet; then
            echo "Keine Aenderungen an den Daten."
          else
            git commit -m "Automatisches Update der Prognosen ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
